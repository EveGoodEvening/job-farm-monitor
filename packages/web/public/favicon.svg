<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <style>
    .tile { fill: #1b1c20; }
    .cell { fill: #f9f9fb; }
    .on { fill: #5e6ad2; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #eeeff1; }
      .cell { fill: #0f1012; }
      .on { fill: #6e79e0; }
    }
  </style>
  <rect class="tile" width="18" height="18" rx="5"/>
  <rect class="cell" x="5" y="5" width="3" height="3" rx="1"/>
  <rect class="on" x="10" y="5" width="3" height="3" rx="1"/>
  <rect class="cell" x="5" y="10" width="3" height="3" rx="1"/>
  <rect class="cell" x="10" y="10" width="3" height="3" rx="1"/>
</svg>
